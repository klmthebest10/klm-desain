async function magicDesign(sample,q,signal,say){
  const styleName=(AI_STYLES.find(s=>s[0]===aiStyle)||AI_STYLES[0])[1];
  const prompt=`Anda desainer grafis profesional. Rancang SATU desain untuk kanvas ${doc.W}×${doc.H} piksel (rasio ${(doc.W/doc.H).toFixed(2)}).
Permintaan pengguna: """${q.slice(0,1500)}"""
Gaya: ${styleName}. Bahasa teks mengikuti permintaan (default Bahasa Indonesia). Gunakan informasi dari permintaan apa adanya; jangan mengarang nomor telepon, alamat, harga, atau nama yang tidak disebut. Jika butuh contoh, tulis yang jelas generik seperti "Nama Toko".
Aturan tata letak: koordinat x,y,w,h dalam PERSEN dari lebar/tinggi kanvas (0–100), x,y = pojok kiri atas. Beri margin ≥5%. Teks tidak boleh bertumpuk dan harus kontras dengan latarnya. Hierarki jelas: satu judul besar, pendukung lebih kecil. Ukuran huruf "size" dalam persen dari sisi terpendek kanvas (judul 8–16, subjudul 4–7, isi 2.5–4). Pakai 2–5 warna yang serasi.
Font yang tersedia: ${AI_FONTS.join(', ')}.
Bentuk yang tersedia: rect, roundrect, circle, triangle, star, blob, line, ring.
Ikon (opsional, nama Lucide): ${AI_ICONS}.
${aiAnim?'Tambahkan animasi masuk "anim" untuk tiap elemen dari: fade, rise, drop, left, right, zoom, pop, bounce, spin, type, dan "delay" detik (0–3) agar muncul bergiliran.':'Jangan sertakan animasi.'}
Balas HANYA JSON dengan bentuk:
{"background":{"type":"solid","color":"#hex"} atau {"type":"gradient","colors":["#hex","#hex"],"angle":135},
 "elements":[
  {"type":"shape","shape":"roundrect","x":5,"y":5,"w":40,"h":20,"color":"#hex","opacity":1,"rotation":0${aiAnim?',"anim":"fade","delay":0':''}},
  {"type":"text","text":"...","x":8,"y":10,"w":84,"size":12,"font":"Poppins","weight":700,"italic":false,"color":"#hex","align":"center","letterSpacing":0,"lineHeight":1.1${aiAnim?',"anim":"rise","delay":0.2':''}},
  {"type":"icon","name":"phone","x":10,"y":80,"size":6,"color":"#hex"${aiAnim?',"anim":"pop","delay":1':''}}
 ]}
Elemen digambar berurutan (yang awal di belakang). Maksimal 18 elemen.`;
  let chars=0;
  const spec=await sample.json(prompt,{signal,cache:false,onText:({text})=>{ chars=text.length; say(`AI sedang merancang… (${chars} karakter)`); }});
  if(!spec||!Array.isArray(spec.elements)) throw {code:'invalid_json'};
  say('Menyusun desain di kanvas…');
  await buildFromSpec(spec);
  say('Desain selesai. Klik elemen mana pun untuk mengubahnya.');
  return spec;
}
async function buildFromSpec(spec){
  let icons=null; try{ icons=await getIcons(); }catch(e){}
  const iconMap=icons?new Map(icons.map(i=>[i.n,i])):new Map();
  const W=doc.W, H=doc.H, M=Math.min(W,H);
  const objs=[]; const fonts=[];
  const els=spec.elements.slice(0,24);
  for(const e of els){ if(e&&e.type==='text'){ const f=AI_FONTS.includes(e.font)?e.font:'Poppins'; fonts.push([f,+e.weight>=600?'700':'400',e.italic?'italic':'normal']); } }
  await loadFonts(fonts);
  const ANIMS=new Set(ANIM_IN.map(a=>a[0]));
  for(const e of els){
    if(!e||typeof e!=='object') continue;
    const x=clamp(e.x,-20,120,10)/100*W, y=clamp(e.y,-20,120,10)/100*H, w=clamp(e.w,1,140,30)/100*W, hh=clamp(e.h,0.3,140,10)/100*H;
    let o=null;
    if(e.type==='text'&&e.text){
      const f=AI_FONTS.includes(e.font)?e.font:'Poppins';
      o=new fabric.Textbox(String(e.text).slice(0,600),{left:x,top:y,width:Math.max(20,w),fontFamily:f,fontWeight:+e.weight>=600?'700':'400',fontStyle:e.italic?'italic':'normal',
        fontSize:clamp(e.size,1,40,5)/100*M,fill:colorOr(e.color,'#1a1d26'),textAlign:['left','center','right','justify'].includes(e.align)?e.align:'left',
        charSpacing:clamp(e.letterSpacing,-100,1000,0),lineHeight:clamp(e.lineHeight,0.7,3,1.15),name:'Teks'});
      if(isHex(e.bg)) o.set('textBackgroundColor',e.bg);
    } else if(e.type==='shape'){
      const col=colorOr(e.color,'#e9542f'), common={left:x,top:y,fill:col,opacity:clamp(e.opacity,0.05,1,1),strokeWidth:0};
      switch(e.shape){
        case 'circle': o=new fabric.Ellipse(Object.assign(common,{rx:w/2,ry:(e.h!=null?hh:w)/2,name:'Lingkaran'})); break;
        case 'ring': o=new fabric.Ellipse(Object.assign(common,{rx:w/2,ry:(e.h!=null?hh:w)/2,fill:'transparent',stroke:col,strokeWidth:Math.max(2,M*0.012),name:'Cincin'})); break;
        case 'triangle': o=new fabric.Triangle(Object.assign(common,{width:w,height:hh,name:'Segitiga'})); break;
        case 'star': o=new fabric.Polygon(starPts(5,w/2,w*.21),Object.assign(common,{name:'Bintang'})); break;
        case 'line': o=new fabric.Line([x,y,x+w,y],{stroke:col,strokeWidth:Math.max(2,hh>0&&e.h!=null?Math.min(hh,M*0.03):M*0.006),opacity:common.opacity,name:'Garis'}); break;
        case 'blob': { const R=rng(Math.floor(Math.random()*1e6)); const pts=[]; for(let i=0;i<8;i++){ const a=i/8*Math.PI*2, r=0.75+R()*0.5; pts.push([w/2+Math.cos(a)*w/2*r,hh/2+Math.sin(a)*hh/2*r]); }
          let d=''; for(let i=0;i<=8;i++){ const p=pts[i%8], q=pts[(i+1)%8], mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2; d+=i===0?`M ${mx} ${my} `:`Q ${p[0]} ${p[1]} ${mx} ${my} `; } d+='Z';
          o=new fabric.Path(d,Object.assign(common,{name:'Blob'})); break; }
        case 'roundrect': o=new fabric.Rect(Object.assign(common,{width:w,height:hh,rx:Math.min(w,hh)*0.18,ry:Math.min(w,hh)*0.18,name:'Persegi bulat'})); break;
        default: o=new fabric.Rect(Object.assign(common,{width:w,height:hh,name:'Persegi'}));
      }
      if(e.rotation) o.rotate(clamp(e.rotation,-360,360,0));
    } else if(e.type==='icon'){
      const ic=iconMap.get(String(e.name||'').toLowerCase())||iconMap.get('star');
      if(ic){ try{ o=await svgToObject(iconSVG(ic.s,colorOr(e.color,'#1a1d26'),2)); o.set({kind:'icon',iconName:ic.n,iconStroke:2,name:'Ikon '+ic.n}); o.scaleToWidth(clamp(e.size,1,60,6)/100*M); o.set({left:x,top:y}); }catch(_){ o=null; } }
    }
    if(!o) continue;
    o.set({id:uid()});
    if(aiAnim&&e.anim&&ANIMS.has(e.anim)&&e.anim!=='none') o.anim={in:e.anim,inDur:e.anim==='type'?1.4:0.8,delay:clamp(e.delay,0,10,0),loop:'none',out:'none',outDur:0.6};
    objs.push(o);
  }
  if(!objs.length) throw {code:'invalid_json'};
  await queue(async()=>{
    if(canvas.getObjects().length){ commitPage(); doc.pages.splice(cur+1,0,newPage()); await loadPage(cur+1); }
    loading=true; canvas.discardActiveObject(); canvas.setBackgroundImage(null);
    const bg=spec.background||{};
    if(bg.type==='gradient'&&Array.isArray(bg.colors)&&bg.colors.length>=2&&isHex(bg.colors[0])&&isHex(bg.colors[1])){
      canvas.setBackgroundColor(bg.colors[0]);
      const r=new fabric.Rect({left:0,top:0,width:W,height:H,strokeWidth:0,id:uid(),name:'Latar gradasi',bgRect:true,selectable:false,evented:false,hasControls:false,lockMovementX:true,lockMovementY:true});
      r.gradAngle=clamp(bg.angle,0,360,135); r.set('fill',makeGrad(bg.colors[0],bg.colors[1],r.gradAngle)); canvas.add(r);
    } else canvas.setBackgroundColor(colorOr(bg.color,'#ffffff'));
    objs.forEach(o=>canvas.add(o));
    fixTexts(canvas);
    // teks yang turun baris jangan sampai menimpa teks di bawahnya: perkecil sedikit demi sedikit
    const texts=objs.filter(isText).sort((a,b)=>a.top-b.top);
    texts.forEach((t,i)=>{
      const below=texts.slice(i+1).filter(u=>u.top>t.top+2&&u.left<t.left+t.width&&u.left+u.width>t.left);
      const lim=below.length?Math.min(...below.map(u=>u.top)):H*0.98, f0=t.fontSize; let n=0;
      while(t.top+t.height>lim-2&&n<14&&t.fontSize>f0*0.5){ t.set('fontSize',t.fontSize*0.93); t.initDimensions(); n++; }
      t.setCoords();
    });
    loading=false; canvas.requestRenderAll(); record(); renderProps(); scheduleLayers();
    if(aiAnim&&objs.some(o=>o.anim)){ doc.anim=true; page().dur=Math.max(5,Math.ceil(Math.max(...objs.map(o=>o.anim?(o.anim.delay+o.anim.inDur):0))+2.5)); renderPages(); }
  });
}

/* ---------- ilustrasi AI ---------- */
function sanitizeSVG(raw){
  const m=String(raw||'').match(/<svg[\s\S]*<\/svg>/i); if(!m) throw new Error('AI tidak mengirim gambar vektor. Coba lagi.');
  const d=new DOMParser().parseFromString(m[0],'image/svg+xml');
  if(d.querySelector('parsererror')) throw new Error('Gambar vektor dari AI rusak. Coba lagi.');
  const root=d.documentElement;
  const ALLOWED=new Set(['svg','g','path','rect','circle','ellipse','line','polyline','polygon','defs','lineargradient','radialgradient','stop','title','desc','clippath','use']);
  const walk=el=>{ for(const c of [...el.children]){ if(!ALLOWED.has(c.tagName.toLowerCase())){ c.remove(); continue; }
      for(const a of [...c.attributes]){ const n=a.name.toLowerCase(), v=a.value; if(n.startsWith('on')||n==='style'&&/url\(\s*['"]?(?!#)/i.test(v)||((n==='href'||n==='xlink:href')&&!v.startsWith('#'))) c.removeAttribute(a.name); }
      walk(c); } };
  for(const a of [...root.attributes]) if(a.name.toLowerCase().startsWith('on')) root.removeAttribute(a.name);
  walk(root);
  if(!root.getAttribute('viewBox')) root.setAttribute('viewBox','0 0 512 512');
  return new XMLSerializer().serializeToString(root);
}
async function aiIllustration(sample,q,style,signal,say){
  const styles={datar:'flat vector, bold simple shapes, no outlines, pleasant harmonious palette',garis:'clean line art with consistent stroke width (stroke only, minimal fills)',kartun:'friendly cartoon style with dark outlines and soft flat colours',isometrik:'isometric 3D-look illustration built from flat faces with light, mid and dark tones'};
  const prompt=`Create an ORIGINAL vector illustration as one SVG for: "${q.slice(0,500)}".
Style: ${styles[style]||styles.datar}.
Rules: viewBox="0 0 512 512"; use only <g>, <path>, <rect>, <circle>, <ellipse>, <polygon>, <polyline>, <line> and optional <linearGradient>; every shape has explicit fill and/or stroke colours as attributes; transparent background (no full-canvas background rect); no <text>, no <image>, no <style>, no filters, no scripts, no external references; 20–90 shapes; keep the subject centred with a small margin. Draw an original design of your own; do not depict trademarked logos, brand mascots, or existing copyrighted characters — if the request names one, draw a generic original alternative instead.
Reply with ONLY the SVG code.`;
  const r=await sample(prompt,{signal,cache:false,onText:({text})=>say(`AI sedang menggambar… (${text.length} karakter)`)});
  const svg=sanitizeSVG(r.text);
  say('Menempatkan ilustrasi…');
  const o=await svgToObject(svg);
  o.set({kind:'illus',name:'Ilustrasi AI'});
  o.scaleToWidth(Math.min(doc.W,doc.H)*0.55);
  if(o.getScaledHeight()>doc.H*0.8) o.scaleToHeight(doc.H*0.8);
  place(o,'Ilustrasi AI');
  say('Ilustrasi ditambahkan ke halaman.');
  return o;
}

      const r=await s(`${instr}\nTeks ini dipakai di desain grafis, jadi pertahankan baris baru bila ada. Balas HANYA dengan hasilnya, tanpa tanda kutip dan tanpa penjelasan.\n\nTeks:\n${src.slice(0,3000)}`,{signal,modelTier:'quick',cache:false});
      const t=cleanAIText(r.text); if(!t) throw {code:'empty_completion'};

      o.set('text',t); o.initDimensions(); o.setCoords(); canvas.requestRenderAll(); record(); content.value=t;
      st.innerHTML=''; st.append('Selesai. ',h('button',{type:'button',class:'linkbtn',onclick:()=>{ if(before!=null){ o.set('text',before); o.initDimensions(); canvas.requestRenderAll(); record(); content.value=before; st.textContent='Dikembalikan ke teks semula.'; } }},'Kembalikan'));

}
