<title>KLM Desain</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Lexend:wght@400;700&family=Nunito:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Kanit:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;700&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Righteous&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Slab:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Lobster&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Caveat:wght@400;700&display=swap">
<style>
/* Layout: editor kerja — header tipis, rel ikon kiri, laci alat, kanvas di tengah, panel properti kanan; di HP rel pindah ke bawah dan panel jadi lembar bawah */
:root{
  --chrome:#ffffff; --panel:#ffffff; --ws:#e6e8ee; --line:#dfe2e9; --hover:#f0f2f6;
  --fg:#1a1d26; --muted:#666e80; --accent:#e9542f; --accent-ink:#ffffff; --accent-soft:#fde4db;
  --danger:#d33a3a; --ok:#1f9d63; --shadow:0 1px 2px rgba(18,22,36,.08),0 10px 30px rgba(18,22,36,.14);
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --brand:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#16181e; --panel:#1b1e25; --ws:#0f1115; --line:#2b2f39; --hover:#242833;
  --fg:#eceef3; --muted:#959cab; --accent:#ff6a43; --accent-ink:#1a0d08; --accent-soft:#3b2219;
  --danger:#ff6b6b; --ok:#3ccf8e; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#16181e; --panel:#1b1e25; --ws:#0f1115; --line:#2b2f39; --hover:#242833;
  --fg:#eceef3; --muted:#959cab; --accent:#ff6a43; --accent-ink:#1a0d08; --accent-soft:#3b2219;
  --danger:#ff6b6b; --ok:#3ccf8e; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.5); color-scheme:dark}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ws);color:var(--fg);font:14px/1.4 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}

.app{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr)}
/* header */
.top{display:flex;align-items:center;gap:8px;background:var(--chrome);border-bottom:1px solid var(--line);padding-block:0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:700 18px/1 var(--brand);letter-spacing:-.02em;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.docname{min-width:0;flex:0 1 240px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:600}
.docname:hover{border-color:var(--line)}
.docname:focus{border-color:var(--accent);outline:none;background:var(--panel)}
.status{color:var(--muted);font-size:12px;white-space:nowrap}
.sp{flex:1}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:9px;background:transparent;color:var(--fg)}
.ib:hover:not(:disabled){background:var(--hover)}
.ib:disabled{opacity:.35;cursor:default}
.ib.sm{width:30px;height:30px;border-radius:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.06);background:var(--accent)}
.btn.full{width:100%}
.btn.danger{color:var(--danger)}
.menuwrap{position:relative}
.pop{position:absolute;right:0;top:44px;z-index:50;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.pop button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left}
.pop button:hover{background:var(--hover)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.pop .k{margin-left:auto;color:var(--muted);font-size:12px}

/* main */
.main{display:grid;grid-template-columns:76px auto minmax(0,1fr) auto;min-height:0}
.rail{background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;overflow:auto;padding-left:max(6px,env(safe-area-inset-left,0px))}
.rail button{border:0;background:transparent;border-radius:10px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.rail button:hover{background:var(--hover);color:var(--fg)}
.rail button.on{color:var(--accent);background:var(--accent-soft)}
.drawer{width:312px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dhead,.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 16px;font:700 15px/1.2 var(--ui)}
.dbody,.pbody{overflow:auto;padding:4px 16px 24px;flex:1;min-height:0}
.center{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
.ws{overflow:auto;position:relative;min-height:0}
.stagewrap{display:flex;min-width:100%;min-height:100%;width:max-content;padding:40px}
.stage{margin:auto;box-shadow:0 2px 6px rgba(0,0,0,.12),0 18px 50px rgba(0,0,0,.14);line-height:0}
.ws.drop::after{content:"Lepaskan gambar di sini";position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:16px;display:grid;place-items:center;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 70%,transparent);pointer-events:none}
.props{width:296px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}

/* bottom strip */
.strip{display:flex;align-items:center;gap:10px;background:var(--chrome);border-top:1px solid var(--line);padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-width:0}
.pgtools{display:flex;gap:2px;flex:none}
.pglist{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.pg{position:relative;height:56px;flex:none;border:2px solid var(--line);border-radius:8px;padding:0;background:#fff;overflow:hidden;max-width:120px}
.pg img{width:100%;height:100%;object-fit:contain;display:block}
.pg.on{border-color:var(--accent)}
.pgn{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px}
.zoom{display:flex;align-items:center;gap:2px;flex:none}
.zoom output{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}

/* panel parts */
.psec{padding:14px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
.psec:last-child{border-bottom:0}
.psec h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field{display:grid;gap:6px;min-width:0}
.field>label,.frow label{font-size:12.5px;font-weight:600}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.frow output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-width:0}
.num span{padding:0 0 0 9px;color:var(--muted);font-size:12px;font-weight:700}
.num input{width:100%;min-width:0;border:0;background:transparent;padding:7px 8px;font-variant-numeric:tabular-nums}
.num input:focus{outline:none}
.num:focus-within{border-color:var(--accent)}
.txt,select.txt,textarea.txt{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;min-width:0}
textarea.txt{resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;background:var(--hover)}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 4px;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;height:34px;display:grid;place-items:center;font-weight:600;font-size:12.5px;padding:0 6px}
.tbtn:hover{background:var(--hover)}
.tbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.crow{display:flex;gap:8px;align-items:center}
.cpick{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel);flex:none}
.chex{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:7px 9px;font-variant-numeric:tabular-nums;text-transform:lowercase}
.swatches{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.sw{aspect-ratio:1;width:100%;min-width:0;border-radius:50%;border:1px solid rgba(0,0,0,.15);padding:0}
.sw:hover{transform:scale(1.12)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.check input{accent-color:var(--accent);width:16px;height:16px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.empty{color:var(--muted);font-size:13px;margin:8px 0}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 2px;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600}
.qa button:hover{background:var(--hover)}
.qa button.warn{color:var(--danger)}

/* drawer contents */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tcard{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--hover);overflow:hidden;display:grid;text-align:left}
.tcard:hover{border-color:var(--accent)}
.tcard img{width:100%;display:block;background:#fff}
.tcard span{padding:6px 8px;font-size:12px;font-weight:600;background:var(--panel)}
.shapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shapes button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;place-items:center;color:var(--fg);padding:10px}
.shapes button:hover{border-color:var(--accent);color:var(--accent)}
.shapes svg{width:100%;height:100%}
.syms{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.syms button{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:22px;padding:0;line-height:1}
.syms button:hover{border-color:var(--accent)}
.tpre{display:grid;gap:8px}
.tpre button{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;text-align:left;line-height:1.15}
.tpre button:hover{border-color:var(--accent)}
.combos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.combos button{border:1px solid var(--line);border-radius:10px;background:var(--hover);min-height:74px;padding:8px;line-height:1.05;overflow:hidden;word-break:break-word}
.combos button:hover{border-color:var(--accent)}
.ugrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.uitem{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--hover);aspect-ratio:1}
.uitem>button:first-child{all:unset;cursor:pointer;display:block;width:100%;height:100%}
.uitem img{width:100%;height:100%;object-fit:contain}
.uitem .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
.layer{display:flex;align-items:center;gap:2px;border:1px solid transparent;border-radius:9px;padding:2px}
.layer:hover{background:var(--hover)}
.layer.on{border-color:var(--accent);background:var(--accent-soft)}
.layer.hid .ltext{opacity:.45;text-decoration:line-through}
.lname{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px;text-align:left}
.lthumb{width:28px;height:28px;border-radius:6px;background:var(--hover);display:grid;place-items:center;flex:none;color:var(--muted)}
.ltext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500}
.gbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gbtns button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);padding:0}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.48);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;overflow:hidden}
.modal h2{margin:0;padding:18px 20px 6px;font:700 18px/1.2 var(--brand);letter-spacing:-.01em}
.mbody{padding:10px 20px;overflow:auto;display:grid;gap:14px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px 18px;flex-wrap:wrap}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.presets button{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 10px;text-align:left;display:grid;gap:2px}
.presets button.on{border-color:var(--accent);background:var(--accent-soft)}
.presets small{color:var(--muted);font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.keys kbd{font:600 12px/1 var(--ui);background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:4px 7px;white-space:nowrap;justify-self:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--fg);color:var(--panel);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:600;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:4px}
.boot{position:fixed;inset:0;background:var(--ws);display:grid;place-items:center;z-index:200;font-weight:600;color:var(--muted);text-align:center;padding:24px}
.editchip{display:none}

/* phone */
@media (max-width:820px){
  .app{grid-template-rows:52px minmax(0,1fr)}
  .brand b,.status,.hide-sm{display:none}
  .docname{flex:1 1 auto}
  .main{grid-template-columns:minmax(0,1fr);padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:40;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px));overflow:visible}
  .rail button{flex:1;padding:6px 0;font-size:10px}
  .drawer,.props{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:auto;max-height:56%;z-index:35;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .props:not(.open){display:none}
  .stagewrap{padding:16px}
  .pg{height:44px}
  .editchip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;box-shadow:var(--shadow);align-items:center;gap:6px}
  .editchip.show{display:inline-flex}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- v2: pustaka, latar generatif, hapus latar, animasi, AI ---------- */
.libgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.libitem{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg);display:grid;place-items:center;padding:7px}
.libitem:hover{border-color:var(--accent);color:var(--accent)}
.libitem svg,.libitem img{width:100%;height:100%;display:block}
.libitem.em{padding:5px}
.credit{font-size:11px}
.bggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bgitem{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0;overflow:hidden;display:grid;text-align:center}
.bgitem:hover{border-color:var(--accent)}
.bgitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.bgitem span{font-size:11px;font-weight:600;padding:4px 2px}
.pals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pal{display:flex;height:26px;border-radius:7px;overflow:hidden;border:2px solid transparent;padding:0;background:none}
.pal i{flex:1}
.pal.on{border-color:var(--accent)}
.pbar{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.modal.wide{width:min(1100px,100%);height:min(780px,calc(100% - 24px))}
.modal.wide .mbody{flex:1;min-height:0}
.cutwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;height:100%;min-height:0}
.cutstage{position:relative;min-height:260px;border-radius:12px;overflow:hidden;background:var(--hover);touch-action:none}
.cutview{display:block;cursor:none;touch-action:none}
.cutside{overflow:auto;min-height:0;padding-right:2px}
.brushcur{position:absolute;border:2px solid #fff;outline:1px solid rgba(0,0,0,.6);border-radius:50%;pointer-events:none}
.player{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;height:100%;min-height:0}
.playstage{display:grid;place-items:center;min-height:200px;background:#0d0f14;border-radius:12px;overflow:hidden}
.playcv{display:block;max-width:100%;max-height:100%}
.playbar{display:flex;align-items:center;gap:12px}
.playbar input{flex:1}
.tnum{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;white-space:nowrap}
.animgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--hover);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.aistatus{background:var(--accent-soft);color:var(--fg);border-radius:9px;padding:9px 11px;margin:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}

let toastT;
function toast(msg,action){
  document.querySelectorAll('.toast').forEach(t=>t.remove());

  if(action) t.append(h('button',{type:'button',onclick:()=>{t.remove();action.fn();}},action.label));
  document.body.append(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),action?6500:3200);
}
function modal(title,body,actions){
  const scrim=h('div',{class:'scrim'});

  const foot=h('div',{class:'mfoot'});

    b.addEventListener('click',()=>{ if(a.onclick) a.onclick(close,b); else close(); });

function dataURLtoBlob(u){ const [head,b64]=u.split(','); const mime=head.match(/:(.*?);/)[1]; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }

/* ================= unduhan ================= */
let dlPromise=null;
function getDl(){
  if(!dlPromise) dlPromise=(window.claude&&typeof window.claude.use==='function')? window.claude.use('downloads').catch(()=>null) : Promise.resolve(null);
  return dlPromise;
}
async function saveBlob(name,blob){
  const dl=await getDl();
  if(dl){
    try{ await dl.save({filename:name,data:blob}); toast('Tersimpan: '+name); return true; }
    catch(e){
      const c=e&&e.code;
      if(c==='declined'){ toast('Unduhan dibatalkan'); return false; }
      if(c==='rate_limited'){ toast('Masih ada unduhan yang menunggu. Coba lagi sebentar.'); return false; }
      if(c==='too_large'){ toast('Berkas terlalu besar. Pilih resolusi lebih kecil.'); return false; }
      if((c==='rejected_extension'||c==='extension_not_enabled')&&window.JSZip&&!/\.zip$/i.test(name)){ const z=new window.JSZip(); z.file(name,blob); return saveBlob(name.replace(/\.[^.]+$/,'')+'.zip',await z.generateAsync({type:'blob'})); }
    }
  }
  const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Mengunduh '+name); return true;
}

/* ================= penyimpanan otomatis (IndexedDB) ================= */
const IDB={
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open('klm-desain',1);}catch(e){ return rej(e);} r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ this.db=r.result; res(r.result); }; r.onerror=()=>rej(r.error); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
};

const SYS=new Set(['Arial','Georgia','Times New Roman','Courier New','Impact','Verdana','sans-serif','serif','monospace','Helvetica']);
const fontDone=new Set();
async function loadFont(f,w='400',s='normal'){
  if(!f||SYS.has(f)) return;
  const wt=(w==='bold'||+w>=600)?'700':'400', st=s==='italic'?'italic':'normal';
  const key=f+'|'+wt+'|'+st; if(fontDone.has(key)) return;
  try{ await Promise.race([document.fonts.load(`${st} ${wt} 40px "${f}"`),new Promise(r=>setTimeout(r,4000))]); }catch(e){}
  fontDone.add(key);
}
const loadFonts=list=>Promise.all(list.map(x=>loadFont(x[0],x[1],x[2])));
function collectFonts(json){
  const out=[];
  (function walk(arr){ (arr||[]).forEach(o=>{ if(o&&o.fontFamily) out.push([o.fontFamily,String(o.fontWeight||'400'),o.fontStyle||'normal']); if(o&&o.objects) walk(o.objects); }); })(json&&json.objects);
  return out;
}
const isText=o=>o&&(o.type==='textbox'||o.type==='i-text'||o.type==='text');
function fixTexts(c){
  fabric.util.clearFabricFontCache();

/* fabric 5.3 memakai nilai textBaseline yang salah eja; betulkan agar konsol bersih */
(function(){ const orig=fabric.Text.prototype._setTextStyles, desc=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'textBaseline');
  if(!orig||!desc||!desc.set) return;
  fabric.Text.prototype._setTextStyles=function(ctx,cs,fm){
    if(!ctx||!(ctx instanceof CanvasRenderingContext2D)) return orig.call(this,ctx,cs,fm);
    Object.defineProperty(ctx,'textBaseline',{configurable:true,get(){ return desc.get.call(ctx); },set(v){ desc.set.call(ctx,v==='alphabetical'?'alphabetic':v); }});
    try{ return orig.call(this,ctx,cs,fm); } finally{ delete ctx.textBaseline; } };
})();

function assetId(s){ let id=assetIds.get(s); if(!id){ id='a'+Date.now().toString(36)+(++assetSeq).toString(36); assets.set(id,s); assetIds.set(s,id); } return id; }
function putAsset(id,s){ if(!assets.has(id)){ assets.set(id,s); assetIds.set(s,id); } }
function pack(o){
  if(Array.isArray(o)){ for(const x of o) if(x&&typeof x==='object') pack(x); return o; }
  for(const k in o){ const v=o[k];
    if(typeof v==='string'){ if(ASSET_KEYS.has(k)&&v.startsWith('data:')) o[k]='klm:'+assetId(v); }
    else if(v&&typeof v==='object') pack(v); }
  return o;
}
function unpack(o){
  if(Array.isArray(o)) return o.map(x=>x&&typeof x==='object'?unpack(x):x);
  const r={};
  for(const k in o){ const v=o[k];
    if(typeof v==='string'&&v.startsWith('klm:')&&ASSET_KEYS.has(k)) r[k]=assets.get(v.slice(4))||'';
    else r[k]=v&&typeof v==='object'?unpack(v):v; }
  return r;
}
const assetURL=v=>typeof v==='string'&&v.startsWith('klm:')?(assets.get(v.slice(4))||''):v;
function usedAssets(){ const ids=new Set(); const txt=JSON.stringify(doc.pages.map(p=>p.json))+JSON.stringify(doc.uploads); for(const m of txt.matchAll(/klm:([a-z0-9]+)/g)) ids.add(m[1]); return ids; }

function fitZoom(){ const ws=$('#ws'); const pad=isPhone()?32:80; const aw=Math.max(80,ws.clientWidth-pad), ah=Math.max(80,ws.clientHeight-pad); return Math.max(0.03,Math.min(aw/doc.W,ah/doc.H)); }
function setZoom(z,fit=false){

let recT;
const snapshot=()=>JSON.stringify(pageJSON());
function record(){
  if(loading) return;
  clearTimeout(recT);
  recT=setTimeout(()=>{
    if(loading) return;
    const hs=page().hist, s=snapshot();
    if(hs.stack[hs.idx]===s) return;
    hs.stack=hs.stack.slice(0,hs.idx+1); hs.stack.push(s);
    if(hs.stack.length>80) hs.stack.shift();
    hs.idx=hs.stack.length-1;
    updateUndo(); afterChange();
  },280);
}
function updateUndo(){ const hs=page().hist; $('#undoBtn').disabled=hs.idx<=0; $('#redoBtn').disabled=hs.idx>=hs.stack.length-1; }
function restore(s){
  return queue(async()=>{
    loading=true; canvas.discardActiveObject();
    const json=unpack(JSON.parse(s)); await loadFonts(collectFonts(json));
    await new Promise(r=>canvas.loadFromJSON(json,r));
    fixTexts(canvas); canvas.requestRenderAll(); loading=false;
    updateUndo(); afterChange(); renderProps(); renderLayers();
  });
}
function undo(){ const hs=page().hist; if(hs.idx>0){ hs.idx--; restore(hs.stack[hs.idx]); } }
function redo(){ const hs=page().hist; if(hs.idx<hs.stack.length-1){ hs.idx++; restore(hs.stack[hs.idx]); } }

let guides=[], dragging=false;
canvas.on('object:moving',e=>{
  dragging=true; guides=[];
  const o=e.target, tol=7/zoom, br=o.getBoundingRect(true,true);
  const moving=new Set(o.type==='activeSelection'?o.getObjects():[o]);
  const vx=[0,doc.W/2,doc.W], vy=[0,doc.H/2,doc.H];
  canvas.getObjects().forEach(x=>{ if(moving.has(x)||x.visible===false||x.bgRect) return; const b=x.getBoundingRect(true,true); vx.push(b.left,b.left+b.width/2,b.left+b.width); vy.push(b.top,b.top+b.height/2,b.top+b.height); });
  const xs=[br.left,br.left+br.width/2,br.left+br.width], ys=[br.top,br.top+br.height/2,br.top+br.height];
  let bx=null,by=null;
  for(const t of vx) for(const s of xs){ const d=t-s; if(Math.abs(d)<tol&&(!bx||Math.abs(d)<Math.abs(bx.d))) bx={d,t}; }
  for(const t of vy) for(const s of ys){ const d=t-s; if(Math.abs(d)<tol&&(!by||Math.abs(d)<Math.abs(by.d))) by={d,t}; }
  if(bx){ o.left+=bx.d; guides.push({x:bx.t}); }
  if(by){ o.top+=by.d; guides.push({y:by.t}); }
  if(bx||by) o.setCoords();
});
canvas.on('after:render',e=>{
  if(!dragging||!guides.length||!e.ctx) return;
  const ctx=e.ctx, r=canvas.getRetinaScaling();
  ctx.save(); ctx.setTransform(r*zoom,0,0,r*zoom,0,0);
  ctx.strokeStyle='#ff2e88'; ctx.lineWidth=1/zoom; ctx.setLineDash([4/zoom,3/zoom]);
  guides.forEach(g=>{ ctx.beginPath(); if(g.x!=null){ ctx.moveTo(g.x,0); ctx.lineTo(g.x,doc.H);} else { ctx.moveTo(0,g.y); ctx.lineTo(doc.W,g.y);} ctx.stroke(); });
  ctx.restore();
});
canvas.on('mouse:up',()=>{ if(dragging){ dragging=false; guides=[]; canvas.requestRenderAll(); } });

function prepImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Berkas tidak bisa dibaca'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('Format gambar tidak didukung'));
      img.onload=()=>{
        const max=2400, m=Math.max(img.naturalWidth,img.naturalHeight);
        if(m<=max||/svg/.test(file.type)) return res(fr.result);
        const k=max/m, c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(/png|webp|gif/.test(file.type)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.92));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function addImageURL(url,name='Gambar'){
  return new Promise(res=>{
    fabric.Image.fromURL(url,(img,err)=>{
      if(err||!img||!img.width){ toast('Gambar tidak bisa dibuka'); return res(null); }
      img.scale(Math.min(doc.W*.7/img.width,doc.H*.7/img.height));
      res(place(img,name));
    });
  });
}

    catch(e){ toast(e.message); }
  }
  if(doc.uploads.length>40) doc.uploads.length=40;
  persistSoon(); if(curTab==='upload') renderTab();
}

function alignPage(dir){

  if(dir==='t') o.top-=b.top; if(dir==='m') o.top+=doc.H/2-(b.top+b.height/2); if(dir==='b') o.top+=doc.H-(b.top+b.height);
  o.setCoords(); canvas.requestRenderAll(); record(); renderProps();

function withLoose(fn){
  const sel=canvas.getActiveObject(); if(!sel||sel.type!=='activeSelection') return;
  const objs=sel.getObjects(); canvas.discardActiveObject();

function alignAmong(dir){
  withLoose(objs=>{
    const bs=objs.map(o=>o.getBoundingRect(true,true));
    const L=Math.min(...bs.map(b=>b.left)),T=Math.min(...bs.map(b=>b.top)),R=Math.max(...bs.map(b=>b.left+b.width)),B=Math.max(...bs.map(b=>b.top+b.height));
    objs.forEach((o,i)=>{ const b=bs[i];
      if(dir==='l') o.left+=L-b.left; if(dir==='c') o.left+=(L+R)/2-(b.left+b.width/2); if(dir==='r') o.left+=R-(b.left+b.width);
      if(dir==='t') o.top+=T-b.top; if(dir==='m') o.top+=(T+B)/2-(b.top+b.height/2); if(dir==='b') o.top+=B-(b.top+b.height);
    });
  });
}
function distribute(axis){
  const sel=canvas.getActiveObject(); if(!sel||sel.type!=='activeSelection'||sel.getObjects().length<3){ toast('Pilih minimal 3 elemen untuk diratakan jaraknya'); return; }
  withLoose(objs=>{
    const items=objs.map(o=>({o,b:o.getBoundingRect(true,true)}));
    const P=axis==='h'?'left':'top', S=axis==='h'?'width':'height';
    items.sort((a,b)=>(a.b[P]+a.b[S]/2)-(b.b[P]+b.b[S]/2));
    const start=items[0].b[P], end=Math.max(...items.map(x=>x.b[P]+x.b[S]));
    const total=items.reduce((s,x)=>s+x.b[S],0), gap=(end-start-total)/(items.length-1);
    let pos=start;
    items.forEach(x=>{ x.o[P]+=pos-x.b[P]; pos+=x.b[S]+gap; });
  });
}

function applyFrame(o,kind){
  const w=o.width,hh=o.height,m=Math.min(w,hh);
  let cp=null;
  if(kind==='circle') cp=new fabric.Circle({radius:m/2,originX:'center',originY:'center',left:0,top:0});
  if(kind==='round') cp=new fabric.Rect({width:w,height:hh,rx:m*.12,ry:m*.12,originX:'center',originY:'center',left:0,top:0});
  if(kind==='square') cp=new fabric.Rect({width:m,height:m,originX:'center',originY:'center',left:0,top:0});
  if(kind==='hexa'){ cp=new fabric.Polygon(regPoly(6,m/2),{originX:'center',originY:'center',left:0,top:0}); }
  if(kind==='star'){ cp=new fabric.Polygon(starPts(5,m/2,m*.23),{originX:'center',originY:'center',left:0,top:0}); }
  if(kind==='heart'){ cp=new fabric.Path(PATHS.heart,{originX:'center',originY:'center',left:0,top:0}); cp.scaleToWidth(m); }

}

async function resizeDoc(p,scale){
  if(p.W===doc.W&&p.H===doc.H){ doc.dpi=p.dpi; renderProps(); return; }
  commitPage();
  const sx=p.W/doc.W, sy=p.H/doc.H, s=Math.min(sx,sy);
  doc.pages.forEach(pg=>{
    const j=pg.json;
    (j.objects||[]).forEach(o=>{
      if(o.bgRect){ o.left=0; o.top=0; o.width=p.W; o.height=p.H; o.scaleX=1; o.scaleY=1; return; }
      if(scale){
        const cx=(o.originX==='center')?o.left:o.left+(o.width*o.scaleX)/2, cy=(o.originY==='center')?o.top:o.top+(o.height*o.scaleY)/2;
        o.scaleX*=s; o.scaleY*=s;
        const ncx=cx*sx, ncy=cy*sy;
        o.left=(o.originX==='center')?ncx:ncx-(o.width*o.scaleX)/2;
        o.top=(o.originY==='center')?ncy:ncy-(o.height*o.scaleY)/2;
      }
    });
    if(j.backgroundImage){ const b=j.backgroundImage, k=Math.max(p.W/b.width,p.H/b.height); Object.assign(b,{scaleX:k,scaleY:k,originX:'center',originY:'center',left:p.W/2,top:p.H/2}); }
    pg.hist={stack:[],idx:-1};
  });
  doc.W=p.W; doc.H=p.H; doc.dpi=p.dpi;
  setZoom(fitZoom(),true); await loadPage(cur); regenThumbs(); persistSoon(); if(curTab==='tpl') renderTab();

}

async function doExport({fmt,scale,scope,transparent}){
  const idxs=scope==='all'?doc.pages.map((_,i)=>i):[cur];

    if(!window.jspdf) throw new Error('modul PDF belum termuat');
    const dpi=doc.dpi||96, pw=doc.W/dpi*72, ph=doc.H/dpi*72, orient=pw>ph?'l':'p';
    const pdf=new window.jspdf.jsPDF({orientation:orient,unit:'pt',format:[pw,ph],compress:true});
    for(let k=0;k<idxs.length;k++){ if(k>0) pdf.addPage([pw,ph],orient); const url=await pageURL(idxs[k],{format:'jpeg',mult,transparent:false}); pdf.addImage(url,'JPEG',0,0,pw,ph,undefined,'FAST'); }

    if(fmt==='svg'){ const svg=await withStatic(i,sc=>sc.toSVG()); files.push({name:nm(i,'svg'),data:new Blob([svg],{type:'image/svg+xml'})}); }
    else { const url=await pageURL(i,{format:fmt==='jpg'?'jpeg':'png',mult,transparent:fmt==='png'&&transparent}); files.push({name:nm(i,fmt),data:dataURLtoBlob(url)}); }
  }

}

document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.matches&&t.matches('input,textarea,select,[contenteditable]')) return;
  if(document.querySelector('.scrim')) return;
  const a=canvas.getActiveObject(); if(a&&a.isEditing) return;
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod&&k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  else if(mod&&(k==='y'||(k==='z'&&e.shiftKey))){ e.preventDefault(); redo(); }
  else if(mod&&k==='s'){ e.preventDefault(); saveProject(); }
  else if(mod&&k==='c'){ if(a){ e.preventDefault(); copySel(); } }
  else if(mod&&k==='x'){ if(a){ e.preventDefault(); copySel(); deleteSel(); } }
  else if(mod&&k==='d'){ e.preventDefault(); cloneSel(OFF()); }
  else if(mod&&k==='g'){ e.preventDefault(); e.shiftKey?ungroupSel():groupSel(); }
  else if(mod&&k==='a'){ e.preventDefault(); const objs=canvas.getObjects().filter(o=>o.selectable&&o.visible!==false&&!o.bgRect); if(objs.length){ canvas.discardActiveObject(); canvas.setActiveObject(objs.length>1?new fabric.ActiveSelection(objs,{canvas}):objs[0]); canvas.requestRenderAll(); } }
  else if(k==='delete'||k==='backspace'){ if(a){ e.preventDefault(); deleteSel(); } }
  else if(k==='escape'){ if(canvas.isDrawingMode) setDrawing(false); canvas.discardActiveObject(); canvas.requestRenderAll(); }
  else if(k.startsWith('arrow')&&a){ e.preventDefault(); const s=e.shiftKey?10:1; nudge(k==='arrowleft'?-s:k==='arrowright'?s:0,k==='arrowup'?-s:k==='arrowdown'?s:0); }
  else if(!mod&&k==='t'){ addText('Ketik teks Anda',{size:48}); }
  else if(mod&&(k==='='||k==='+')){ e.preventDefault(); setZoom(zoom*1.2); }
  else if(mod&&k==='-'){ e.preventDefault(); setZoom(zoom/1.2); }
  else if(mod&&k==='0'){ e.preventDefault(); setZoom(fitZoom(),true); }
});

function matcher(q){
  const words=q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if(!words.length) return ()=>true;
  const alts=words.map(w=>[w,...((ID_EN[w]||'').split(' ').filter(Boolean))]);
  const f=t=>alts.every(a=>a.some(x=>t.includes(x)));
  f.score=(name)=>{ let sc=0; for(const a of alts) for(const x of a) if(name.includes(x)){ sc+=name.startsWith(x)?3:2; break; } return sc; };
  return f;
}

  lowpoly:{t:'Poligon',draw(ctx,w,h,P,R){ const n=8,mx=n,my=Math.max(3,Math.round(n*h/w)),pts=[]; for(let j=0;j<=my;j++){ pts.push([]); for(let i=0;i<=mx;i++){ const jx=(i>0&&i<mx)?(R()-.5)*w/mx*.8:0, jy=(j>0&&j<my)?(R()-.5)*h/my*.8:0; pts[j].push([i*w/mx+jx,j*h/my+jy]); } }

  rays:{t:'Sinar',draw(ctx,w,h,P,R){ ctx.fillStyle=P[1]; ctx.fillRect(0,0,w,h); const n=16+2*Math.floor(R()*8), L=Math.hypot(w,h); ctx.save(); ctx.translate(w/2,h/2); ctx.fillStyle=P[0]; for(let i=0;i<n;i+=2){ const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a0)*L,Math.sin(a0)*L); ctx.lineTo(Math.cos(a1)*L,Math.sin(a1)*L); ctx.closePath(); ctx.fill(); } const rg=ctx.createRadialGradient(0,0,0,0,0,L/2); rg.addColorStop(0,hexA('#ffffff',.35)); rg.addColorStop(1,hexA('#ffffff',0)); ctx.fillStyle=rg; ctx.fillRect(-L,-L,L*2,L*2); ctx.restore(); }},
  confetti:{t:'Konfeti',draw(ctx,w,h,P,R){ ctx.fillStyle=P[4]===undefined?'#fff':'#ffffff'; ctx.fillRect(0,0,w,h); const m=Math.min(w,h); for(let i=0;i<160;i++){ ctx.save(); ctx.translate(R()*w,R()*h); ctx.rotate(R()*Math.PI); ctx.fillStyle=P[i%5]; const s=m*(0.008+R()*0.018); if(R()<.5) ctx.fillRect(-s,-s*.4,s*2,s*.8); else { ctx.beginPath(); ctx.arc(0,0,s*.6,0,Math.PI*2); ctx.fill(); } ctx.restore(); } }},
  halftone:{t:'Halftone',draw(ctx,w,h,P,R){ ctx.fillStyle=P[2]; ctx.fillRect(0,0,w,h); const s=Math.max(w,h)/48, ang=R()*Math.PI*2; ctx.fillStyle=P[0]; for(let y=0;y<h+s;y+=s) for(let x=0;x<w+s;x+=s){ const t=((x-w/2)*Math.cos(ang)+(y-h/2)*Math.sin(ang))/Math.hypot(w,h)+0.5; const r=s*0.48*Math.max(0,Math.min(1,t)); if(r>0.3){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); } } }},
  bauhaus:{t:'Geometris',draw(ctx,w,h,P,R){ ctx.fillStyle=P[2]; ctx.fillRect(0,0,w,h); const cols=4, rows=Math.max(2,Math.round(4*h/w)), cw=w/cols, ch=h/rows; for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const x=i*cw,y=j*ch,k=Math.floor(R()*5); ctx.fillStyle=P[Math.floor(R()*5)]; ctx.fillRect(x,y,cw+1,ch+1); ctx.fillStyle=P[(Math.floor(R()*5)+1)%5]; ctx.beginPath(); const r=Math.min(cw,ch);
    if(k===0){ ctx.arc(x+cw/2,y+ch/2,r*.4,0,Math.PI*2); } else if(k===1){ ctx.moveTo(x,y); ctx.arc(x,y,r,0,Math.PI/2); } else if(k===2){ ctx.moveTo(x,y+ch); ctx.lineTo(x+cw,y+ch); ctx.lineTo(x+cw/2,y); } else if(k===3){ ctx.arc(x+cw/2,y+ch,r/2,Math.PI,0); } else { ctx.rect(x+cw*.2,y+ch*.2,cw*.6,ch*.6); } ctx.closePath(); ctx.fill(); } }},
  grain:{t:'Kertas',draw(ctx,w,h,P,R){ ctx.fillStyle=P[2]; ctx.fillRect(0,0,w,h); const id=ctx.getImageData(0,0,w,h), d=id.data; for(let i=0;i<d.length;i+=4){ const n=(R()-.5)*22; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } ctx.putImageData(id,0,0); }},
};

/* ================= hapus latar dengan AI (U2-Net, berjalan di perangkat) ================= */
const U2={model:null,W:null,gl:null,mode:null,loading:null};
function u2Load(){
  if(!U2.loading) U2.loading=(async()=>{
    let mr,br;
    try{ [mr,br]=await Promise.all([fetch('u2netp.json'),fetch('u2netp-weights.json')]); }
    catch(e){ throw new Error('Model AI tidak bisa dimuat. Pastikan berkas u2netp.json dan u2netp-weights.json ada di folder yang sama.'); }
    if(!mr.ok||!br.ok) throw new Error('Berkas model AI tidak ditemukan');
    U2.model=await mr.json();
    const wj=await br.json(); const bin=atob(wj.b64), n=wj.n|0;
    if(wj.fmt!=='f32le'||bin.length!==n*4) throw new Error('Berkas model AI rusak');
    const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    U2.W=new Float32Array(bytes.buffer);
  })().catch(e=>{ U2.loading=null; throw e; });
  return U2.loading;
}
function cpuInfer(input,onProg){
  return new Promise((res,rej)=>{
    const code=U2ENGINE_SRC+'\nonmessage=e=>{try{const d=e.data;const y=u2Run(d.model,d.W,d.input,320,320,p=>postMessage({p}));postMessage({out:y.d},[y.d.buffer]);}catch(err){postMessage({err:String(err&&err.message||err)});}};';
    const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    let w; try{ w=new Worker(url); }catch(e){ URL.revokeObjectURL(url); return rej(e); }
    w.onmessage=e=>{ const d=e.data; if(d.p!=null) onProg&&onProg(d.p); else { w.terminate(); URL.revokeObjectURL(url); d.err?rej(new Error(d.err)):res({d:d.out,w:320,h:320}); } };
    w.onerror=e=>{ w.terminate(); URL.revokeObjectURL(url); rej(new Error(e.message||'Worker gagal')); };
    w.postMessage({model:U2.model,W:U2.W,input});
  });
}
function outOK(d){ let mn=Infinity,mx=-Infinity; for(let i=0;i<d.length;i+=37){ const v=d[i]; if(!isFinite(v)) return false; if(v<mn) mn=v; if(v>mx) mx=v; } return mx-mn>1e-4; }
async function u2Infer(input,onProg){
  if(U2.mode!=='cpu'){
    try{
      if(!U2.gl) U2.gl=U2GL(U2.model,U2.W);
      const r=await U2.gl.run(input,320,320,onProg);
      if(outOK(r.d)){ U2.mode='gl'; return r; }
      throw new Error('hasil GPU tidak valid');
    }catch(e){ console.warn('GPU tidak dipakai, beralih ke CPU:',e&&e.message); try{ U2.gl&&U2.gl.dispose(); }catch(_){} U2.gl=null; U2.mode='cpu'; }
  }
  return cpuInfer(input,onProg);
}
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Gambar tidak bisa dibaca')); i.src=src; }); }
function imgPixels(img,maxSide){
  const k=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*k)), hh=Math.max(1,Math.round(img.naturalHeight*k));
  const c=document.createElement('canvas'); c.width=w; c.height=hh; const x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(img,0,0,w,hh);
  return {w,h:hh,data:x.getImageData(0,0,w,hh).data};
}
function modelInput(img){
  const c=document.createElement('canvas'); c.width=c.height=320; const x=c.getContext('2d',{willReadFrequently:true});
  x.imageSmoothingQuality='high'; x.drawImage(img,0,0,320,320);
  const d=x.getImageData(0,0,320,320).data; let mx=1;
  for(let i=0;i<d.length;i++){ if((i&3)!==3&&d[i]>mx) mx=d[i]; }
  const N=320*320, inp=new Float32Array(3*N), mean=[.485,.456,.406], sd=[.229,.224,.225];
  for(let i=0;i<N;i++) for(let c2=0;c2<3;c2++) inp[c2*N+i]=(d[i*4+c2]/mx-mean[c2])/sd[c2];
  return inp;
}
function cutoutSection(o){
  const box=h('div',{class:'field'});
  box.append(h('button',{type:'button',class:'btn pri full',html:icon('scissors',18)+(o.origSrc?'Sempurnakan potongan':'Hapus latar (AI)'),onclick:()=>startCutout(o)}));
  if(o.origSrc) box.append(h('button',{type:'button',class:'btn full',onclick:()=>restoreOriginal(o)},'Kembalikan foto asli'));
  else box.append(h('p',{class:'hint'},'AI memisahkan objek utama dari latarnya, langsung di perangkat Anda. Foto tidak dikirim ke mana pun.'));
  return sec('Hapus latar',box);
}
function restoreOriginal(o){
  const src=assetURL(o.origSrc); if(!src) return;
  const cw=o.getScaledWidth(), c=o.getCenterPoint(), pad=(o.cutOpt&&o.cutOpt.pad)||0, wk=(o.cutOpt&&o.cutOpt.ww)||0;
  o.setSrc(src,()=>{
    const sc=wk? (cw/(wk+2*pad))*(wk/o.width) : cw/o.width;
    o.set({scaleX:sc,scaleY:sc}); o.origSrc=null; o.cutMask=null; o.cutOpt=null;
    if(o.filters&&o.filters.length) try{ o.applyFilters(); }catch(_){}
    if(o.frame&&o.frame!=='none') applyFrame(o,o.frame);
    o.setPositionByOrigin(c,'center','center'); o.setCoords(); canvas.requestRenderAll(); record(); renderProps();
  });
}
function progressModal(title){
  const bar=h('div',{class:'pbar'},h('i',{})), txt=h('p',{class:'hint'},'Menyiapkan…');
  let cancelled=false;
  const close=modal(title,h('div',{style:'display:grid;gap:12px'},txt,bar),[{label:'Batal',onclick:c=>{ cancelled=true; c(); }}]);
  return { set(t,p){ txt.textContent=t; if(p!=null) bar.firstChild.style.width=Math.round(p*100)+'%'; }, close, get cancelled(){ return cancelled; } };
}
async function startCutout(o){
  const origURL=assetURL(o.origSrc)||o.getSrc();
  const pm=progressModal('Hapus latar');
  try{
    pm.set('Memuat model AI (sekali per kunjungan, ±6 MB)…',0.02);
    await u2Load(); if(pm.cancelled) return;
    const img=await loadImg(origURL);
    const work=imgPixels(img,2048);
    let alpha=null;
    if(o.cutMask){
      pm.set('Membuka potongan sebelumnya…',0.5);
      const mi=await loadImg(assetURL(o.cutMask)); const mp=imgPixels(mi,10000);
      if(mp.w===work.w&&mp.h===work.h){ alpha=new Uint8Array(work.w*work.h); for(let i=0;i<alpha.length;i++) alpha[i]=mp.data[i*4]; }
    }
    let aiAlpha=null;
    const runAI=async()=>{
      pm.set('AI sedang mengenali objek…',0.05);
      const t0=performance.now();
      const out=await u2Infer(modelInput(img),p=>pm.set(`AI sedang mengenali objek… ${Math.round(p*100)}%`,0.05+p*0.85));
      pm.set('Merapikan tepi…',0.93); await new Promise(r=>setTimeout(r,20));
      const a=refineMask(out.d,out.w,out.h,work.data,work.w,work.h);
      console.info('Hapus latar selesai dalam',Math.round(performance.now()-t0),'ms via',U2.mode);
      return a;
    };
    if(!alpha){ aiAlpha=await runAI(); alpha=aiAlpha.slice(); }
    if(pm.cancelled) return;
    pm.close();
    openCutEditor(o,origURL,work,alpha,aiAlpha,runAI);
  }catch(e){ console.error(e); pm.close(); toast('Hapus latar gagal: '+(e&&e.message||e)); }
}

/* ---------- penyunting potongan ---------- */
function openCutEditor(o,origURL,work,alpha,aiAlpha,runAI){
  const W=work.w, H=work.h, N=W*H;
  const opt=Object.assign({method:'ai',tol:40,feather:1,outline:false,ow:Math.max(4,Math.round(Math.max(W,H)/90)),oc:'#ffffff',bg:'checker'},o.cutOpt||{});
  if(opt.method!=='ai'&&opt.method!=='color') opt.method='ai';
  let base=alpha;            // mask hasil metode
  let edit=alpha.slice();    // mask yang disunting kuas
  const undoStack=[];
  let tool='erase', brush=Math.max(8,Math.round(Math.max(W,H)/30));
  const view=h('canvas',{class:'cutview'});
  const stageBox=h('div',{class:'cutstage'},view);
  const side=h('div',{class:'cutside'});
  const work2=document.createElement('canvas'); work2.width=W; work2.height=H; const wctx=work2.getContext('2d');
  const id=wctx.createImageData(W,H); id.data.set(work.data);
  let finalAlpha=null;
  function computeFinal(){
    if(opt.feather>0){ const f=new Float32Array(N); for(let i=0;i<N;i++) f[i]=edit[i]; const b=boxBlur(f,W,H,Math.round(opt.feather)); finalAlpha=new Uint8Array(N); for(let i=0;i<N;i++) finalAlpha[i]=Math.round(b[i]); }
    else finalAlpha=edit;
  }
  function outlineMask(a){
    const pad=opt.ow+2, PW=W+2*pad, PH=H+2*pad, f=new Float32Array(PW*PH);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++) f[(y+pad)*PW+x+pad]=a[y*W+x]/255;
    let b=boxBlur(f,PW,PH,Math.max(1,Math.round(opt.ow/2))); b=boxBlur(b,PW,PH,Math.max(1,Math.round(opt.ow/2)));
    const m=new Uint8ClampedArray(PW*PH*4), col=new fabric.Color(opt.oc).getSource();

const ANIM_IN=[['none','Tanpa'],['fade','Muncul pudar'],['rise','Naik'],['drop','Turun'],['left','Dari kiri'],['right','Dari kanan'],['zoom','Membesar'],['pop','Meletup'],['bounce','Memantul'],['spin','Berputar'],['type','Ketik'],['blur','Fokus']];
const ANIM_LOOP=[['none','Tanpa'],['pulse','Berdenyut'],['float','Melayang'],['wobble','Bergoyang'],['blink','Berkedip'],['spin','Berputar terus']];
const ANIM_OUT=[['none','Tanpa'],['fade','Memudar'],['sink','Tenggelam'],['lift','Terangkat'],['shrink','Mengecil']];
const TRANS=[['none','Tanpa'],['fade','Pudar'],['slide','Geser'],['slideUp','Geser ke atas'],['zoom','Perbesar'],['wipe','Sapu'],['circle','Lingkaran']];
const TRANS_IDS=new Set(TRANS.map(t=>t[0]));
const TR_DUR=0.7;

  bounce:t=>{ const n1=7.5625,d1=2.75; if(t<1/d1) return n1*t*t; if(t<2/d1) return n1*(t-=1.5/d1)*t+.75; if(t<2.5/d1) return n1*(t-=2.25/d1)*t+.9375; return n1*(t-=2.625/d1)*t+.984375; }};
function hasAnim(o){ const a=o.anim; return !!(a&&((a.in&&a.in!=='none')||(a.loop&&a.loop!=='none')||(a.out&&a.out!=='none'))); }
function baseState(o){ const c=o.getCenterPoint(); return {left:o.left,top:o.top,scaleX:o.scaleX,scaleY:o.scaleY,angle:o.angle||0,opacity:o.opacity==null?1:o.opacity,text:isText(o)?o.text:null,cx:c.x,cy:c.y}; }
function restoreState(o,b){ o.set({left:b.left,top:b.top,scaleX:b.scaleX,scaleY:b.scaleY,angle:b.angle,opacity:b.opacity}); if(b.text!=null&&o.text!==b.text){ o.set('text',b.text); o.initDimensions(); } o.setCoords(); }
// Terapkan keadaan animasi objek pada waktu t (detik) di halaman berdurasi pageDur.
function animApply(o,b,t,pageDur,D){
  const a=o.anim||{}; let op=b.opacity, dx=0, dy=0, sc=1, rot=0, txt=null, blur=0;
  if(a.in&&a.in!=='none'){
    const d=Math.max(0.1,a.inDur||0.8), p=Math.min(1,Math.max(0,(t-(a.delay||0))/d)), E=EASE.out(p);
    switch(a.in){
      case 'fade': op*=E; break;
      case 'rise': op*=Math.min(1,p*2.5); dy+=(1-E)*D; break;
      case 'drop': op*=Math.min(1,p*2.5); dy-=(1-E)*D; break;
      case 'left': op*=Math.min(1,p*2.5); dx-=(1-E)*D*1.4; break;
      case 'right': op*=Math.min(1,p*2.5); dx+=(1-E)*D*1.4; break;
      case 'zoom': op*=E; sc*=0.55+0.45*E; break;
      case 'pop': op*=p>0?1:0; sc*=Math.max(0,EASE.back(p)); break;
      case 'bounce': op*=p>0?1:0; dy-=(1-EASE.bounce(p))*D*1.6; break;
      case 'spin': op*=E; rot-=(1-E)*120; sc*=0.6+0.4*E; break;
      case 'type': if(b.text!=null){ txt=b.text.slice(0,Math.round(b.text.length*p)); } else op*=E; break;
      case 'blur': op*=E; sc*=1.12-0.12*E; break;

      case 'float': dy+=Math.sin(lt*Math.PI*2/2.6)*D*0.12*k; break;
      case 'wobble': rot+=Math.sin(lt*Math.PI*2/1.1)*6*k; break;
      case 'blink': op*=1-0.6*(0.5-0.5*Math.cos(lt*Math.PI*2/1.3))*k; break;
      case 'spin': rot+=lt*90; break;

    if(o.text!==txt){ o.set('text',txt); o.initDimensions(); }
    o.set({left:b.left+dx,top:b.top+dy});
  } else {
    if(b.text!=null&&o.text!==b.text){ o.set('text',b.text); o.initDimensions(); }
    o.setPositionByOrigin(new fabric.Point(b.cx+dx,b.cy+dy),'center','center');
  }
  o.dirty=true;
}

/* ---------- linimasa (dipakai pemutar & ekspor) ---------- */
async function buildTimeline(idxs,outW,outH){
  commitPage();
  const scenes=[]; let t=0;
  const z=outW/doc.W, D=Math.min(doc.W,doc.H)*0.08;
  for(const i of idxs){
    const pg=doc.pages[i], json=unpack(pg.json);
    await loadFonts(collectFonts(json));
    const sc=new fabric.StaticCanvas(null,{width:outW,height:outH,enableRetinaScaling:false,renderOnAddRemove:false});
    await new Promise(r=>sc.loadFromJSON(json,r));
    fixTexts(sc); sc.setZoom(z);
    const objs=sc.getObjects().filter(o=>!o.bgRect&&hasAnim(o)).map(o=>({o,b:baseState(o)}));
    scenes.push({sc,objs,dur:clampDur(pg.dur),trans:pg.trans||'none',start:t,lastT:-1});
    t+=clampDur(pg.dur);
  }
  const total=t;
  const snapCache=new Map();
  function drawScene(s,lt){
    if(s.lastT!==lt){ for(const {o,b} of s.objs) animApply(o,b,lt,s.dur,D); s.sc.renderAll(); s.lastT=lt; }
    return s.sc.getElement();
  }
  function endFrame(k){
    if(!snapCache.has(k)){ const s=scenes[k]; const c=document.createElement('canvas'); c.width=outW; c.height=outH; c.getContext('2d').drawImage(drawScene(s,s.dur-0.001),0,0); snapCache.set(k,c); }
    return snapCache.get(k);
  }
  function render(ctx,time){
    time=Math.max(0,Math.min(total-0.0005,time));
    let k=scenes.findIndex(s=>time<s.start+s.dur); if(k<0) k=scenes.length-1;
    const s=scenes[k], lt=time-s.start;
    ctx.save(); ctx.globalAlpha=1; ctx.clearRect(0,0,outW,outH);
    if(k>0&&s.trans!=='none'&&lt<TR_DUR){
      const p=EASE.inOut(lt/TR_DUR), prev=endFrame(k-1), curEl=drawScene(s,lt);
      switch(s.trans){
        case 'fade': ctx.drawImage(prev,0,0); ctx.globalAlpha=p; ctx.drawImage(curEl,0,0); break;
        case 'slide': ctx.drawImage(prev,-p*outW,0); ctx.drawImage(curEl,(1-p)*outW,0); break;
        case 'slideUp': ctx.drawImage(prev,0,-p*outH); ctx.drawImage(curEl,0,(1-p)*outH); break;
        case 'zoom': ctx.drawImage(prev,0,0); ctx.globalAlpha=p; { const z2=0.8+0.2*p; ctx.drawImage(curEl,outW*(1-z2)/2,outH*(1-z2)/2,outW*z2,outH*z2); } break;
        case 'wipe': ctx.drawImage(prev,0,0); ctx.beginPath(); ctx.rect(0,0,outW*p,outH); ctx.clip(); ctx.drawImage(curEl,0,0); break;
        case 'circle': ctx.drawImage(prev,0,0); ctx.beginPath(); ctx.arc(outW/2,outH/2,Math.hypot(outW,outH)/2*p,0,Math.PI*2); ctx.clip(); ctx.drawImage(curEl,0,0); break;
        default: ctx.drawImage(curEl,0,0);
      }
    } else ctx.drawImage(drawScene(s,lt),0,0);
    ctx.restore();
  }
  function dispose(){ scenes.forEach(s=>s.sc.dispose()); snapCache.clear(); }
  return {total,render,dispose,scenes};
}
function outSize(maxShort,maxLong){
  let k=Math.min(maxShort/Math.min(doc.W,doc.H),maxLong/Math.max(doc.W,doc.H));
  let w=Math.round(doc.W*k/2)*2, hh=Math.round(doc.H*k/2)*2;
  return {w:Math.max(2,w),h:Math.max(2,hh)};
}

async function openPlayer(idxsIn){
  const idxs=idxsIn||doc.pages.map((_,i)=>i);
  const cv=h('canvas',{class:'playcv'});
  const playB=h('button',{type:'button',class:'btn pri',html:icon('pause',18),'aria-label':'Jeda'});
  const range=h('input',{type:'range',min:'0',max:'1',step:'0.01',value:'0','aria-label':'Posisi waktu'});
  const tl=h('output',{class:'tnum'},'0,0 / 0,0 dtk');
  const stage=h('div',{class:'playstage'},cv);
  const body=h('div',{class:'player'},stage,h('div',{class:'playbar'},playB,range,tl));
  let T=null, playing=true, t0=0, pos=0, raf=0, src=null, closed=false;
  const close=modal('Pratinjau',body,[{label:'Unduh video',onclick:c=>{ c(); openExport('video'); }},{label:'Tutup',primary:true}]);
  const mEl=body.closest('.modal'); if(mEl) mEl.classList.add('wide');
  const scrim=body.closest('.scrim');
  const obs=new MutationObserver(()=>{ if(!scrim.isConnected){ closed=true; stopAudio(); cancelAnimationFrame(raf); if(T) T.dispose(); obs.disconnect(); } });
  obs.observe(document.body,{childList:true});
  const r=stage.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  const k=Math.min((r.width||600)/doc.W,(r.height||400)/doc.H);
  const cw=Math.max(2,Math.round(doc.W*k)), ch=Math.max(2,Math.round(doc.H*k));
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  const ow=Math.max(2,Math.round(cw*dpr)), oh=Math.max(2,Math.round(ch*dpr)); cv.width=ow; cv.height=oh;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#888'; ctx.font='16px sans-serif'; ctx.fillText('Menyiapkan…',16,28);
  try{ T=await buildTimeline(idxs,ow,oh); }catch(e){ console.error(e); toast('Pratinjau gagal: '+e.message); close(); return; }
  if(closed){ T.dispose(); return; }
  range.max=String(T.total);
  const fmt=x=>x.toFixed(1).replace('.',',');
  function stopAudio(){ if(src){ try{ src.stop(); }catch(_){} src=null; } }
  function startAudio(at){ stopAudio(); if(!music) return; const ac=getAudioCtx(); if(!ac) return; ac.resume&&ac.resume(); src=ac.createBufferSource(); src.buffer=music.buffer; src.loop=true; src.connect(ac.destination); src.start(0,at%music.buffer.duration); }
  function frame(){
    if(closed) return;
    if(playing){ pos=(performance.now()-t0)/1000; if(pos>=T.total){ pos=0; t0=performance.now(); startAudio(0); } }
    T.render(ctx,pos); range.value=String(pos); tl.textContent=`${fmt(pos)} / ${fmt(T.total)} dtk`;
    raf=requestAnimationFrame(frame);
  }
  function setPlay(v){ playing=v; playB.innerHTML=icon(v?'pause':'play',18); playB.setAttribute('aria-label',v?'Jeda':'Putar'); if(v){ t0=performance.now()-pos*1000; startAudio(pos); } else stopAudio(); }
  playB.onclick=()=>setPlay(!playing);
  range.oninput=()=>{ pos=+range.value; if(playing){ t0=performance.now()-pos*1000; startAudio(pos); } };
  setPlay(true); frame();
}

/* ---------- ekspor video ---------- */
function videoContainers(){
  const MR=window.MediaRecorder; if(!MR||!HTMLCanvasElement.prototype.captureStream) return [];
  const out=[]; const ok=t=>{ try{ return MR.isTypeSupported(t); }catch(e){ return false; } };
  if(['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4'].some(ok)) out.push('mp4');
  if(['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].some(ok)) out.push('webm');
  return out;
}
function pickMime(container,audio){
  const MR=window.MediaRecorder, ok=t=>{ try{ return MR.isTypeSupported(t); }catch(e){ return false; } };
  const list=container==='mp4'?(audio?['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4']:['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4'])
    :(audio?['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']:['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']);
  return list.find(ok)||'';
}
function videoOptions(body,fmt,v){

    const cs=videoContainers();
    if(!cs.length){ body.append(h('p',{class:'hint warn'},'Browser ini belum bisa merekam video. Gunakan Chrome, Edge, atau Safari versi terbaru, atau pilih GIF.')); return; }
    if(!cs.includes(v.container)) v.container=cs[0];
    body.append(
      field('Jenis berkas',seg(cs.map(c=>({v:c,l:c==='mp4'?'MP4':'WebM'})),v.container,x=>v.container=x)),
      field('Kualitas',seg([{v:720,l:'HD 720p'},{v:1080,l:'Full HD 1080p'}],v.q,x=>v.q=x)),
      musicField(),
      h('p',{class:'hint'},'Video direkam secara langsung, jadi lamanya sama dengan durasi desain. Biarkan tab ini tetap terbuka sampai selesai.'));
  } else {
    body.append(
      field('Ukuran',seg([{v:360,l:'Kecil'},{v:480,l:'Sedang'},{v:720,l:'Besar'}],v.gifSize,x=>v.gifSize=x)),

      h('p',{class:'hint'},'GIF cocok untuk stiker dan pesan singkat. Untuk desain panjang, pilih Video agar berkas lebih kecil.'));
  }
}
async function exportVideo(idxs,v){
  const mime=pickMime(v.container,!!music);
  if(!mime){ toast('Format video ini tidak didukung di browser ini'); return; }
  const {w,h:hh}=outSize(v.q,v.q===1080?1920:1280);
  const pm=progressModal('Membuat video');
  let T=null, ac=null, rec=null, src=null;
  try{
    pm.set('Menyiapkan halaman…',0);
    T=await buildTimeline(idxs,w,hh);
    if(pm.cancelled) return;
    const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; const ctx=cv.getContext('2d');
    T.render(ctx,0);
    const stream=cv.captureStream(30);
    if(music){
      ac=new (window.AudioContext||window.webkitAudioContext)(); const dest=ac.createMediaStreamDestination();
      src=ac.createBufferSource(); src.buffer=music.buffer; src.loop=true;
      const g=ac.createGain(); src.connect(g); g.connect(dest);
      const now=ac.currentTime; g.gain.setValueAtTime(1,now); g.gain.setValueAtTime(1,now+Math.max(0,T.total-1.2)); g.gain.linearRampToValueAtTime(0,now+T.total);
      dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    }
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:w*hh>1.5e6?12e6:6e6,audioBitsPerSecond:160000});
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const stopped=new Promise(r=>rec.onstop=r);
    rec.start(250); if(src) src.start();
    const t0=performance.now();
    await new Promise(res=>{
      (function tick(){
        if(pm.cancelled) return res();
        const t=(performance.now()-t0)/1000;
        T.render(ctx,Math.min(t,T.total));
        pm.set(`Merekam… ${Math.min(t,T.total).toFixed(1).replace('.',',')} dari ${T.total.toFixed(1).replace('.',',')} detik`,Math.min(1,t/T.total));
        if(t>=T.total+0.15) return res();
        requestAnimationFrame(tick);
      })();
    });
    rec.stop(); await stopped;
    stream.getTracks().forEach(t=>t.stop());
    if(pm.cancelled){ toast('Pembuatan video dibatalkan'); return; }
    pm.set('Menyimpan…',1);
    const blob=new Blob(chunks,{type:mime.split(';')[0]});
    pm.close();
    await saveBlob(safeName(doc.name)+'.'+v.container,blob);
  }catch(e){ console.error(e); pm.close(); toast('Gagal membuat video: '+(e&&e.message||e)); }
  finally{ try{ src&&src.stop(); }catch(_){} if(ac) ac.close(); if(T) T.dispose(); if(rec&&rec.state!=='inactive') try{ rec.stop(); }catch(_){} }
}
async function exportGif(idxs,v){
  const {w,h:hh}=outSize(v.gifSize,Math.round(v.gifSize*16/9));
  const pm=progressModal('Membuat GIF');
  let T=null;
  try{
    pm.set('Menyiapkan halaman…',0);
    T=await buildTimeline(idxs,w,hh);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=hh; const ctx=cv.getContext('2d',{willReadFrequently:true});
    const n=Math.max(1,Math.round(T.total*v.fps)), delay=100/v.fps;
    const enc=GifEncoder(w,hh,{step:3});
    const samples=[]; const sN=Math.min(10,n);
    for(let i=0;i<sN;i++){ T.render(ctx,(i+0.5)*T.total/sN); ctx.globalCompositeOperation='destination-over'; ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,hh); ctx.globalCompositeOperation='source-over'; samples.push(ctx.getImageData(0,0,w,hh).data); }
    enc.setPalette(samples);
    for(let i=0;i<n;i++){
      if(pm.cancelled){ toast('Pembuatan GIF dibatalkan'); return; }
      T.render(ctx,i/v.fps);
      ctx.globalCompositeOperation='destination-over'; ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,hh); ctx.globalCompositeOperation='source-over';
      enc.addFrame(ctx.getImageData(0,0,w,hh).data,delay);
      if(i%3===0){ pm.set(`Menyusun bingkai ${i+1} dari ${n}…`,i/n); await new Promise(r=>setTimeout(r,0)); }
    }
    pm.close();
    await saveBlob(safeName(doc.name)+'.gif',new Blob([enc.finish()],{type:'image/gif'}));
  }catch(e){ console.error(e); pm.close(); toast('Gagal membuat GIF: '+(e&&e.message||e)); }
  finally{ if(T) T.dispose(); }
}


/* ================= ekspor untuk percetakan (CMYK) ================= */
const MM=25.4;
async function deflateBytes(u8){
  if(typeof CompressionStream==='undefined') return null;
  const s=new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
// RGB -> CMYK dengan penggantian komponen abu-abu penuh (GCR) dan batas total tinta.
function rgbaToCmyk(rgba,n,tac){
  const out=new Uint8Array(n*4), lim=tac/100;
  for(let i=0;i<n;i++){
    const a=rgba[i*4+3]/255;
    const r=(rgba[i*4]*a+255*(1-a))/255, g=(rgba[i*4+1]*a+255*(1-a))/255, b=(rgba[i*4+2]*a+255*(1-a))/255;
    const k=1-Math.max(r,g,b);
    let c=0,m=0,y=0;
    if(k<0.9999){ const d=1-k; c=(1-r-k)/d; m=(1-g-k)/d; y=(1-b-k)/d; }
    const sum=c+m+y+k;
    if(sum>lim){ const s=Math.max(0,(lim-k)/(c+m+y)); c*=s; m*=s; y*=s; }
    out[i*4]=Math.round(c*255); out[i*4+1]=Math.round(m*255); out[i*4+2]=Math.round(y*255); out[i*4+3]=Math.round(k*255);
  }
  return out;
}
// Perkiraan warna RGB yang terlalu terang untuk tinta cetak
function gamutWarning(rgba,n){
  let bad=0,cnt=0;
  for(let i=0;i<n;i+=97){
    const r=rgba[i*4]/255,g=rgba[i*4+1]/255,b=rgba[i*4+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), s=mx?((mx-mn)/mx):0;
    cnt++;
    if(s>0.75&&mx>0.8){
      let hdeg; const d=mx-mn||1;
      if(mx===r) hdeg=60*(((g-b)/d)%6); else if(mx===g) hdeg=60*((b-r)/d+2); else hdeg=60*((r-g)/d+4);
      if(hdeg<0) hdeg+=360;
      if((hdeg>=85&&hdeg<=165)||(hdeg>=190&&hdeg<=290)||(hdeg>=295&&hdeg<=330)) bad++;
    }
  }
  return cnt?bad/cnt:0;
}
// Render halaman dengan area bleed (dalam satuan desain), hasil RGBA
async function renderPrintPage(i,{scale,bleed}){
  const json=unpack(i===cur?pageJSON():doc.pages[i].json);

    const bi=sc.backgroundImage;

function pdfStr(s){ const out=new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i)&255; return out; }
const f2=v=>(Math.round(v*1000)/1000).toString();
// Susun PDF CMYK: tiap halaman satu gambar DeviceCMYK, TrimBox/BleedBox, tanda potong opsional.
async function buildCmykPdf(pages,{title}){
  const parts=[], offs=[]; let pos=0;
  const push=u=>{ parts.push(u); pos+=u.length; };
  const obj=(n,body)=>{ offs[n]=pos; push(pdfStr(`${n} 0 obj\n`)); for(const b of [].concat(body)) push(typeof b==='string'?pdfStr(b):b); push(pdfStr('\nendobj\n')); };
  push(pdfStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  const nPages=pages.length; const firstPageObj=4;
  const kids=[]; for(let i=0;i<nPages;i++) kids.push(`${firstPageObj+i*3} 0 R`);
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${nPages} >>`);
  const esc=s=>String(s).replace(/[\\()]/g,m=>'\\'+m).replace(/[^\x20-\x7e]/g,'?');
  obj(3,`<< /Title (${esc(title)}) /Producer (KLM Desain) /Creator (KLM Desain) >>`);
  for(let i=0;i<nPages;i++){
    const p=pages[i], po=firstPageObj+i*3, co=po+1, io=po+2;
    const MW=p.trimW+2*(p.bleed+p.slug), MH=p.trimH+2*(p.bleed+p.slug);
    const tx0=p.bleed+p.slug, ty0=p.bleed+p.slug, tx1=tx0+p.trimW, ty1=ty0+p.trimH;
    const bx0=p.slug, by0=p.slug, bx1=MW-p.slug, by1=MH-p.slug;
    obj(po,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f2(MW)} ${f2(MH)}] /BleedBox [${f2(bx0)} ${f2(by0)} ${f2(bx1)} ${f2(by1)}] /TrimBox [${f2(tx0)} ${f2(ty0)} ${f2(tx1)} ${f2(ty1)}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>`);
    let cs=`q\n${f2(bx1-bx0)} 0 0 ${f2(by1-by0)} ${f2(bx0)} ${f2(by0)} cm\n/Im0 Do\nQ\n`;
    if(p.marks){
      const off=Math.max(p.bleed,8.5), len=14;
      cs+='q\n0.3 w\n1 1 1 1 K\n';
      for(const x of [tx0,tx1]) for(const [y,dir] of [[ty0,-1],[ty1,1]]) cs+=`${f2(x)} ${f2(y+dir*off)} m ${f2(x)} ${f2(y+dir*(off+len))} l S\n`;
      for(const y of [ty0,ty1]) for(const [x,dir] of [[tx0,-1],[tx1,1]]) cs+=`${f2(x+dir*off)} ${f2(y)} m ${f2(x+dir*(off+len))} ${f2(y)} l S\n`;
      cs+='Q\n';
    }
    const csb=pdfStr(cs);
    obj(co,[`<< /Length ${csb.length} >>\nstream\n`,csb,'\nendstream']);
    const filt=p.zipped?' /Filter /FlateDecode':'';
    obj(io,[`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceCMYK /BitsPerComponent 8${filt} /Length ${p.bytes.length} >>\nstream\n`,p.bytes,'\nendstream']);
  }
  const nObj=firstPageObj+nPages*3;
  const xref=pos;
  let x=`xref\n0 ${nObj}\n0000000000 65535 f \n`;
  for(let n=1;n<nObj;n++) x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  x+=`trailer\n<< /Size ${nObj} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  push(pdfStr(x));
  return new Blob(parts,{type:'application/pdf'});
}
// TIFF CMYK (Deflate bila tersedia), resolusi tertanam
async function buildCmykTiff(w,h,cmyk,dpi){
  const z=await deflateBytes(cmyk); const data=z||cmyk, comp=z?8:1;
  const tags=[[256,4,1,w],[257,4,1,h],[258,3,4,'bps'],[259,3,1,comp],[262,3,1,5],[273,4,1,'data'],[277,3,1,4],[278,4,1,h],[279,4,1,data.length],[282,5,1,'xres'],[283,5,1,'yres'],[284,3,1,1],[296,3,1,2],[332,3,1,1]];
  const ifdOff=8, ifdSize=2+tags.length*12+4, bpsOff=ifdOff+ifdSize, xresOff=bpsOff+8, yresOff=xresOff+8, dataOff=yresOff+8;
  const head=new DataView(new ArrayBuffer(dataOff));
  head.setUint8(0,0x49); head.setUint8(1,0x49); head.setUint16(2,42,true); head.setUint32(4,ifdOff,true);
  head.setUint16(ifdOff,tags.length,true);
  tags.forEach(([tag,type,count,val],k)=>{
    const o=ifdOff+2+k*12; head.setUint16(o,tag,true); head.setUint16(o+2,type,true); head.setUint32(o+4,count,true);
    const v=val==='bps'?bpsOff:val==='data'?dataOff:val==='xres'?xresOff:val==='yres'?yresOff:val;
    if(type===3&&count===1) head.setUint16(o+8,v,true); else head.setUint32(o+8,v,true);
  });
  head.setUint32(ifdOff+2+tags.length*12,0,true);
  for(let k=0;k<4;k++) head.setUint16(bpsOff+k*2,8,true);
  const dpiR=Math.round(dpi*100);
  head.setUint32(xresOff,dpiR,true); head.setUint32(xresOff+4,100,true); head.setUint32(yresOff,dpiR,true); head.setUint32(yresOff+4,100,true);
  return new Blob([head.buffer,data],{type:'image/tiff'});
}

async function exportPrint(idxs,po){
  const pm=progressModal('Menyiapkan berkas cetak');
  try{
    const dpi=(doc.dpi||96), scale=po.scale, bleedU=po.bleed/MM*dpi; // satuan desain
    const toPt=v=>v/dpi*72;
    const pages=[]; let warn=0;
    for(let k=0;k<idxs.length;k++){
      if(pm.cancelled) return;
      pm.set(`Merender halaman ${k+1} dari ${idxs.length}…`,k/idxs.length*0.6);
      const r=await renderPrintPage(idxs[k],{scale,bleed:bleedU});
      const n=r.w*r.h; warn=Math.max(warn,gamutWarning(r.data,n));
      pm.set(`Mengonversi ke CMYK (${k+1}/${idxs.length})…`,(k+0.5)/idxs.length*0.6);
      await new Promise(res=>setTimeout(res,0));
      const cmyk=rgbaToCmyk(r.data,n,po.tac);
      if(po.fmt==='tif'){
        pm.set('Menyusun TIFF…',0.8);
        const blob=await buildCmykTiff(r.w,r.h,cmyk,dpi*scale);
        const name=safeName(doc.name)+(idxs.length>1?`-${idxs[k]+1}`:'')+'-CMYK.tif';
        pages.push({name,blob});
      } else {
        pm.set(`Mengompres halaman ${k+1}…`,0.6+(k+1)/idxs.length*0.3);
        const z=await deflateBytes(cmyk);
        pages.push({w:r.w,h:r.h,bytes:z||cmyk,zipped:!!z,trimW:toPt(doc.W),trimH:toPt(doc.H),bleed:toPt(bleedU),slug:po.marks?toPt(12/MM*dpi):0,marks:po.marks});
      }
    }
    pm.set('Menyimpan…',0.95);
    let blob,name;
    if(po.fmt==='tif'){
      if(pages.length===1){ blob=pages[0].blob; name=pages[0].name; }
      else { const zp=new window.JSZip(); pages.forEach(p=>zp.file(p.name,p.blob)); blob=await zp.generateAsync({type:'blob'}); name=safeName(doc.name)+'-CMYK.zip'; }
    } else { blob=await buildCmykPdf(pages,{title:doc.name}); name=safeName(doc.name)+'-CMYK.pdf'; }
    pm.close();
    await saveBlob(name,blob);
    if(warn>0.03) toast('Sebagian warna sangat terang (biru, hijau, atau ungu menyala) akan tampak lebih kusam di kertas. Ini normal untuk cetak CMYK.');
  }catch(e){ console.error(e); pm.close(); toast('Gagal menyiapkan berkas cetak: '+(e&&e.message||e)); }
}

function polliError(status,body){

  let msg=''; try{ const j=JSON.parse(body); msg=(j.error&&(j.error.message||j.error))||j.message||''; }catch(_){ msg=String(body||'').slice(0,160); }
  if(code==='bad_request'&&/content|safety|moderat|policy/i.test(msg)) return {code:'refused',message:msg};
  return {code,message:typeof msg==='string'?msg:''};
}
async function polliFetch(url,opts){

// Antarmuka setara "sample": sample(prompt,{signal,onText}) -> {text}; sample.json(...) -> nilai JSON
function makePolliSample(key){
  async function chat(prompt,opts,json){
    opts=opts||{};
    const body={messages:[{role:'user',content:String(prompt)}],stream:true};
    const m=polliTextModel(); if(m) body.model=m;
    if(json) body.response_format={type:'json_object'};
    let r=await polliFetch(POLLI.gen+'/v1/chat/completions',{method:'POST',signal:opts.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
    if(!r.ok&&json&&r.status===400){ delete body.response_format; r=await polliFetch(POLLI.gen+'/v1/chat/completions',{method:'POST',signal:opts.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)}); }
    if(!r.ok) throw polliError(r.status,await r.text().catch(()=>''));
    let text='';
    const ct=r.headers.get('content-type')||'';
    try{
      if(ct.includes('event-stream')&&r.body){
        const rd=r.body.getReader(), dec=new TextDecoder(); let buf='';
        for(;;){
          const {value,done}=await rd.read(); if(done) break;
          buf+=dec.decode(value,{stream:true});
          let i; while((i=buf.indexOf('\n'))>=0){
            const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
            if(!line.startsWith('data:')) continue;
            const d=line.slice(5).trim(); if(d==='[DONE]') continue;
            try{ const j=JSON.parse(d); const delta=j.choices&&j.choices[0]&&(j.choices[0].delta&&j.choices[0].delta.content||j.choices[0].message&&j.choices[0].message.content)||''; if(delta){ text+=delta; opts.onText&&opts.onText({text,delta}); } }catch(_){}
          }
        }
      } else {
        const j=await r.json(); text=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
        if(text) opts.onText&&opts.onText({text,delta:text});
      }
    }catch(e){ if(opts.signal&&opts.signal.aborted) throw {code:'cancelled'}; if(e&&e.code) throw e; throw {code:'network',message:e&&e.message}; }
    if(!text.trim()) throw {code:'empty_completion'};
    return text;
  }
  const f=async(prompt,opts)=>({text:await chat(prompt,opts,false),truncated:false});
  f.json=async(prompt,opts)=>{
    const t=await chat(prompt+'\n\nBalas hanya dengan JSON yang valid.',opts,true);
    const tryParse=x=>{ try{ return JSON.parse(x); }catch(_){ return undefined; } };
    let v=tryParse(t.trim());
    if(v===undefined){ const m=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) v=tryParse(m[1]); }
    if(v===undefined){ const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) v=tryParse(t.slice(a,b+1)); }
    if(v===undefined) throw {code:'invalid_json'};
    return v;
  };
  return f;
}
